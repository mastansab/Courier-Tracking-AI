# sonar-project.properties - SonarQube Scanner Configuration
# Case 60: Courier Tracking System (Incremental SDLC)
# Student: MASTAN SAB (Roll No: 60, Class 5B)

sonar.projectKey=courier-tracking-ai
sonar.projectName=Courier Tracking AI - Case 60
sonar.projectVersion=1.0.0

sonar.sources=Courier-Tracking-AI/backend,Courier-Tracking-AI/frontend
sonar.tests=Courier-Tracking-AI/tests

sonar.python.version=3.10
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/test-results.xml

sonar.exclusions=**/venv/**,**/dist/**,**/logs/**,**/.pytest_cache/**
sonar.sourceEncoding=UTF-8

# Quality Gate Thresholds
sonar.qualitygate.wait=true
sonar.coverage.minimum=80.0
sonar.duplicatedLinesDensity.maximum=3.0
sonar.maintainabilityRating.minimum=A
